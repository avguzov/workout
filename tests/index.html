<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine tests</title>
<style>
  body { font: 14px/1.4 -apple-system, "Segoe UI", sans-serif; margin: 16px; color: #111; }
  #summary { font-weight: 600; margin-bottom: 8px; }
  .pass { color: #176b2c; }
  .fail { color: #b00020; }
  li { margin: 2px 0; }
  li .msg { display: block; color: #555; font-size: 12px; white-space: pre-wrap; }
  pre { font-size: 12px; background: #f4f4f4; padding: 8px; overflow-x: auto; }
</style>
<script>
  // Classic-script fallback: report a failure if the module graph cannot even load.
  window.__posted = false;
  window.__postResults = function (payload) {
    if (window.__posted) return Promise.resolve();
    window.__posted = true;
    return fetch('/__results', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).catch(function () {});
  };
  window.__moduleStarted = false;
  window.addEventListener('error', function (e) {
    if (window.__moduleStarted) return;
    var msg = (e && e.message) || 'script error';
    if (e && e.filename) msg += ' (' + e.filename + ':' + e.lineno + ')';
    window.__postResults({ passed: 0, failed: 1, results: [{ name: 'page error', ok: false, message: msg }], reports: {} });
  });
</script>
</head>
<body>
<h1>Engine tests</h1>
<div id="summary">Running...</div>
<ol id="results"></ol>
<h2>Reports</h2>
<pre id="reports"></pre>
<script type="module">
  window.__moduleStarted = true;
  const list = document.getElementById('results');
  const summary = document.getElementById('summary');
  function render(r) {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.textContent = (r.ok ? 'PASS ' : 'FAIL ') + r.name;
    if (!r.ok) {
      const m = document.createElement('span');
      m.className = 'msg';
      m.textContent = r.message;
      li.appendChild(m);
    }
    list.appendChild(li);
  }
  try {
    const harness = await import('./harness.js');
    const files = ['./volume.test.js', './duration.test.js', './recommend.test.js', './validate.test.js', './generator.test.js',
      './app_storage.test.js', './app_format.test.js', './app_flow.test.js'];
    for (const f of files) {
      try {
        await import(f);
      } catch (e) {
        harness.test('load ' + f, () => { throw e; });
      }
    }
    const rep = await harness.run(render);
    summary.textContent = rep.passed + ' passed, ' + rep.failed + ' failed';
    summary.className = rep.failed ? 'fail' : 'pass';
    document.getElementById('reports').textContent = JSON.stringify(rep.reports, null, 2);
    await window.__postResults(rep);
  } catch (e) {
    summary.textContent = 'Test run crashed: ' + ((e && e.stack) || e);
    summary.className = 'fail';
    await window.__postResults({ passed: 0, failed: 1, results: [{ name: 'test run', ok: false, message: String((e && e.stack) || e) }], reports: {} });
  }
</script>
</body>
</html>
