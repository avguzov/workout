<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App end-to-end run</title>
<style>
  html, body { margin: 0; padding: 0; background: #888; }
  #app { display: block; width: 390px; height: 844px; border: 0; background: #fff; }
  #log { font: 12px/1.3 monospace; white-space: pre-wrap; padding: 8px; }
</style>
<script>
  // Classic-script fallback: report a failure if the driver module cannot load.
  window.__posted = false;
  window.__postResults = function (payload) {
    if (window.__posted) return Promise.resolve();
    window.__posted = true;
    return fetch('/__results', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).catch(function () {});
  };
  window.__moduleStarted = false;
  window.addEventListener('error', function (e) {
    if (window.__moduleStarted) return;
    var msg = (e && e.message) || 'script error';
    if (e && e.filename) msg += ' (' + e.filename + ':' + e.lineno + ')';
    window.__postResults({ phase: 0, results: [{ name: 'driver page error', ok: false, message: msg }] });
  });
</script>
</head>
<body>
<iframe id="app" title="app under test"></iframe>
<div id="log"></div>
<script type="module">
  window.__moduleStarted = true;
  import('./e2e.js').catch(function (e) {
    window.__postResults({ phase: 0, results: [{ name: 'driver load', ok: false, message: String((e && e.stack) || e) }] });
  });
</script>
</body>
</html>
